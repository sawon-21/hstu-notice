<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SASTC Notice Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --bg1:#eef4ff;
  --bg2:#f8fbff;
  --text:#101828;
  --muted:#667085;
  --card:rgba(255,255,255,.78);
  --border:rgba(255,255,255,.45);
  --primary:#2563eb;
  --primary2:#0ea5e9;
  --shadow:0 20px 60px rgba(15,23,42,.10);
  --radius:22px;
}

*{box-sizing:border-box;font-family:"Inter","Noto Sans Bengali",system-ui,sans-serif;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  color:var(--text);
  background:
    radial-gradient(circle at top left, rgba(37,99,235,.10), transparent 28%),
    radial-gradient(circle at top right, rgba(14,165,233,.10), transparent 24%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
  min-height:100vh;
}

body.dark{
  --bg1:#0b1220;
  --bg2:#111827;
  --text:#f8fafc;
  --muted:#9ca3af;
  --card:rgba(17,24,39,.70);
  --border:rgba(148,163,184,.16);
  --shadow:0 24px 70px rgba(0,0,0,.30);
}

header{
  padding:28px 20px 18px;
  text-align:center;
  color:white;
  background:linear-gradient(135deg,#0f62fe,#0ea5e9);
  position:relative;
  overflow:hidden;
}
header::before{
  content:"";
  position:absolute;
  inset:-40% -20%;
  background:radial-gradient(circle, rgba(255,255,255,.18), transparent 45%);
  transform:rotate(12deg);
}
header .wrap{
  position:relative;
  max-width:1200px;
  margin:auto;
}
header h1{
  margin:0;
  font-size:clamp(26px,4vw,42px);
  letter-spacing:-.03em;
}
header p{
  margin:10px 0 0;
  opacity:.92;
  font-size:15px;
}

.container{
  max-width:1200px;
  margin:-22px auto 0;
  padding:20px;
  position:relative;
  z-index:2;
}

.toolbar{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:12px;
  align-items:center;
  margin-bottom:18px;
}

.search input{
  width:100%;
  padding:15px 16px;
  border-radius:16px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  box-shadow:var(--shadow);
  outline:none;
  backdrop-filter:blur(16px);
}
.search input::placeholder{color:var(--muted);}

.icon-btn{
  border:none;
  cursor:pointer;
  padding:14px 16px;
  border-radius:16px;
  background:var(--card);
  color:var(--text);
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

.tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:14px 0 22px;
}
.tab{
  padding:11px 18px;
  border-radius:999px;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:.25s ease;
  user-select:none;
}
.tab:hover{transform:translateY(-1px);}
.tab.active{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  border-color:transparent;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
  color:var(--muted);
  font-size:14px;
}
.count{
  background:var(--card);
  border:1px solid var(--border);
  padding:8px 12px;
  border-radius:999px;
  backdrop-filter:blur(12px);
}

.grid{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  backdrop-filter:blur(18px);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
  transition:.25s ease;
  animation:fade .35s ease;
}
.card:hover{transform:translateY(-4px);}
@keyframes fade{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:none;}
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
  margin-bottom:12px;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(239,68,68,.12);
  color:#ef4444;
  font-size:12px;
  font-weight:700;
}
.badge.secondary{
  background:rgba(37,99,235,.12);
  color:var(--primary);
}
.title{
  font-size:18px;
  font-weight:800;
  line-height:1.35;
  margin:0 0 10px;
  letter-spacing:-.02em;
}
.meta{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}
.actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:100%;
  padding:11px 14px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  text-decoration:none;
  border-radius:14px;
  font-weight:700;
  transition:.2s;
}
.btn:hover{opacity:.95;transform:translateY(-1px);}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:48px 20px;
  color:var(--muted);
  background:var(--card);
  border:1px dashed var(--border);
  border-radius:var(--radius);
}

.footer-note{
  margin:18px 0 8px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

@media (max-width: 980px){
  .grid{grid-template-columns:repeat(2, minmax(0, 1fr));}
  .toolbar{grid-template-columns:1fr auto;}
  .icon-btn:last-child{grid-column:2;}
}
@media (max-width: 640px){
  header{padding:22px 16px 14px;}
  .container{padding:16px;}
  .toolbar{grid-template-columns:1fr 1fr;}
  .search{grid-column:1/-1;}
  .grid{grid-template-columns:1fr;}
  .tab{padding:10px 14px;}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>📢 SASTC Notice Board</h1>
    <p>Smart, fast, and organized notices for students and departments</p>
  </div>
</header>

<div class="container">
  <div class="toolbar">
    <div class="search">
      <input id="search" placeholder="Search notice, date, department..." oninput="render()">
    </div>
    <button class="icon-btn" onclick="toggleDark()" aria-label="Toggle theme">🌙</button>
    <button class="icon-btn" onclick="clearSearch()" aria-label="Clear search">✕</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="selectDept('SASTC',this)">SASTC</div>
    <div class="tab" onclick="selectDept('CSE',this)">CSE</div>
    <div class="tab" onclick="selectDept('BBA',this)">BBA</div>
    <div class="tab" onclick="selectDept('Agriculture',this)">Agriculture</div>
  </div>

  <div class="section-head">
    <div id="status">Loading notices...</div>
    <div class="count" id="count">0 notices</div>
  </div>

  <div id="list" class="grid">
    <div class="empty">Loading...</div>
  </div>

  <div class="footer-note">Powered by SASTC Smart Automated Notice System</div>
</div>

<script>
let notices = [];
let selected = "SASTC";

fetch("./notices.json")
  .then(r => r.json())
  .then(data => {
    notices = Array.isArray(data) ? data : (data.notices || []);
    render();
  })
  .catch(() => {
    document.getElementById("list").innerHTML = `<div class="empty">❌ Failed to load notices</div>`;
    document.getElementById("status").textContent = "Unable to load notices";
  });

function selectDept(dep, el){
  selected = dep;
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  el.classList.add("active");
  render();
}

function clearSearch(){
  document.getElementById("search").value = "";
  render();
}

function toggleDark(){
  document.body.classList.toggle("dark");
}

function noticeType(n){
  const text = JSON.stringify(n).toLowerCase();
  if(text.includes("urgent") || text.includes("important")) return "IMPORTANT";
  if((n.link || n.pdf || n.url || "").toLowerCase().includes(".pdf")) return "PDF";
  return "NOTICE";
}

function render(){
  const search = document.getElementById("search").value.toLowerCase().trim();
  const filtered = notices.filter(n => {
    const dept = (n.department || n.category || n.type || "").toLowerCase();
    return dept.includes(selected.toLowerCase()) && JSON.stringify(n).toLowerCase().includes(search);
  });

  document.getElementById("count").textContent = `${filtered.length} notice${filtered.length !== 1 ? 's' : ''}`;
  document.getElementById("status").textContent = `${selected} notices`;

  const box = document.getElementById("list");
  box.innerHTML = "";

  if(!filtered.length){
    box.innerHTML = `<div class="empty">No notice found for ${selected}</div>`;
    return;
  }

  filtered.forEach((n, i) => {
    const title = n.title || n.name || "Notice";
    const date = n.date || n.publish_date || "Date not available";
    const link = n.link || n.pdf || n.url || "#";
    const type = noticeType(n);
    const dept = n.department || n.category || selected;

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-top">
        <span class="badge ${type === 'NOTICE' ? 'secondary' : ''}">${i < 3 ? 'NEW' : type}</span>
      </div>
      <div class="title">${title}</div>
      <div class="meta">
        📅 ${date}<br>
        🏷 ${dept}
      </div>
      <div class="actions">
        <a class="btn" href="${link}" target="_blank" rel="noopener">Open Notice</a>
      </div>
    `;
    box.appendChild(card);
  });
}
</script>
</body>
</html>
