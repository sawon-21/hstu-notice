name: Update HSTU Notices

on:
  workflow_dispatch:
  schedule:
    # Runs every 30 mins between 02:00 UTC and 11:30 UTC (8:00 AM - 5:30 PM BST)
    - cron: "*/30 2-11 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run notice scraper
        run: python scraper.py

      - name: Run result scraper
        run: python result_scraper.py

      - name: Commit updated files to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add notices.json results.json

          if git diff --cached --quiet; then
            echo "No changes in JSON files"
          else
            git commit -m "Auto update notices and results"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
